services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5440:5432"
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
      POSTGRES_DB: artmate_wms
    volumes:
      - wms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d artmate_wms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wms-postgres:
