name: WMS CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn check-types
      - run: yarn lint
      - name: API tests with bounded memory use
        run: node --import tsx --test --test-concurrency=2 test/*.test.ts
        working-directory: apps/api
      - run: yarn workspace @artmate-wms/web test
      - run: node --test scripts/*.test.mjs scripts/release/*.test.mjs
      - run: yarn build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build API without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: artmate-wms-api:ci
          cache-from: type=gha,scope=wms-api
          cache-to: type=gha,mode=max,scope=wms-api
      - name: Build Web without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          tags: artmate-wms-web:ci
          cache-from: type=gha,scope=wms-web
          cache-to: type=gha,mode=max,scope=wms-web
      - name: Check isolated production stack and backup restoration
        run: node scripts/container-smoke.mjs
        env:
          WMS_SMOKE_API_IMAGE: artmate-wms-api:ci
          WMS_SMOKE_WEB_IMAGE: artmate-wms-web:ci
