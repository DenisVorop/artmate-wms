name: Publish WMS images

# Publishes only. Production rollout remains a separate manual action.
on:
  workflow_dispatch:

concurrency:
  group: wms-publish-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image identity
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/artmate-wms-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wms-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=wms-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record immutable image digest
        run: node scripts/release/pipeline.mjs image
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: wms-image-${{ matrix.target }}
          path: image-digests/*.json
          if-no-files-found: error
          retention-days: 30

  manifest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: wms-image-*
          merge-multiple: true
          path: image-digests
      - run: node scripts/release/pipeline.mjs manifest
      - uses: actions/upload-artifact@v4
        with:
          name: wms-release-manifest
          path: release-manifest/release.json
          if-no-files-found: error
          retention-days: 90
      - name: Release instructions
        run: |
          printf 'Published commit `%s`. Run **Deploy WMS production** manually with this full SHA.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
