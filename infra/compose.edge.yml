# Separate server: only Caddy owns public ports. Do not combine with artmate overlay.
services:
  edge:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WMS_DOMAIN: ${WMS_DOMAIN:?Set WMS_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${WMS_EDGE_MEMORY:-256m}
    pids_limit: 128

volumes:
  caddy_data:
  caddy_config:
